name: video_creator_ai
description: "Creador de videos con IA: guion Gemini, imagenes IA/stock, voz off, musica, SFX, exporta MP4."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: 12.0.1
  ffmpeg_kit_flutter_new_audio: ^2.5.7
  flutter_tts: ^4.2.0
  share_plus: ^13.3.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
